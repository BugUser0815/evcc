template: efacec-qc45
products:
  - brand: Efacec
    description:
      generic: QC45
requirements:
  description:
    de: |
      Experimentelle Integration. Der Efacec QC45 muss über das lokale Netzwerk erreichbar sein.
      Der QC45 unterstützt herstellerspezifische Web Services over IP; die konkreten Endpoints sind in der öffentlichen Dokumentation nicht beschrieben.
      Bei Geräten mit mehreren Anschlüssen den zu steuernden Anschluss über `connector` auswählen.
    en: |
      Experimental integration. The Efacec QC45 must be reachable via the local network.
      The QC45 supports vendor-specific Web Services over IP; the concrete endpoints are not described in the public documentation.
      For devices with multiple connectors, select the connector to control using `connector`.
params:
  - name: host
  - name: connector
render: |
  type: efacec-qc45
  uri: {{ .host }}
  connector: {{ .connector }}
