template: efacec-qc45
products:
  - brand: Efacec
    description:
      generic: QC45
capabilities: ["meter", "dim"]
requirements:
  description:
    de: |
      Experimentelle Modbus-TCP-Integration für den Efacec QC45.
      Auf der Ladestation muss der QC45 Modbus-Bridge-Dienst laufen. OCPP/ChargePoint bleibt für Autorisierung sowie Start/Stop zuständig; evcc regelt die verfügbare Ladeleistung.
      Modus "dc" steuert den jeweils aktiven CHAdeMO- oder CCS-Anschluss gemeinsam über das DC-Budget. Modus "type2" steuert den 22-kW-Type2-Anschluss.
    en: |
      Experimental Modbus TCP integration for the Efacec QC45.
      The QC45 Modbus bridge service must be running on the charger. OCPP/ChargePoint remains responsible for authorization and transaction start/stop; evcc controls the available charging power.
      Mode "dc" controls the currently active CHAdeMO or CCS connector through the shared DC budget. Mode "type2" controls the 22 kW Type2 connector.
  evcc: []
caveats:
  - description:
      de: Start und Stop von Ladevorgängen werden derzeit nicht über Modbus ausgeführt. Die evcc-Freigabe ist deshalb logisch immer aktiv; die Leistungsregelung funktioniert über die Budget-Register.
      en: Charging transaction start and stop are currently not performed over Modbus. The evcc enable state therefore remains logically active while power regulation works through the budget registers.
params:
  - name: modbus
    choice: ["tcpip"]
  - name: mode
    default: dc
render: |
  type: efacec-qc45
  {{- include "modbus" . }}
  mode: {{ .mode }}
