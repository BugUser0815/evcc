template: efacec-qc45
products:
  - brand: Efacec
    description:
      generic: QC45
capabilities: ["meter", "dim"]
requirements:
  description:
    de: |
      Experimentelle Modbus-TCP-Integration für den Efacec QC45.
      Auf der Ladestation muss der QC45 Modbus-Bridge-Dienst laufen. OCPP/ChargePoint bleibt für Autorisierung sowie Start/Stop zuständig; evcc regelt die verfügbare Ladeleistung.
      Modus "dc" steuert den jeweils aktiven CHAdeMO- oder CCS-Anschluss gemeinsam über das DC-Budget. Modus "type2" steuert den 43-kW-Type2-Anschluss.
    en: |
      Experimental Modbus TCP integration for the Efacec QC45.
      The QC45 Modbus bridge service must be running on the charger. OCPP/ChargePoint remains responsible for authorization and transaction start/stop; evcc controls the available charging power.
      Mode "dc" controls the currently active CHAdeMO or CCS connector through the shared DC budget. Mode "type2" controls the 43 kW Type2 connector.
  evcc: []
caveats:
  - description:
      de: DC (CHAdeMO/CCS) bleibt nach Neustart und bei evcc „Aus“ gesperrt. Erst Enable(true) und eine neue positive Leistungsvorgabe schalten frei. Alle 5 Sekunden wird die Modbus-110-Freigabe erneuert; nach 30 Sekunden ohne Refresh beendet die QC45 aktive DC-Sitzungen. OCPP bleibt für Autorisierung zuständig. Type2 bleibt betreiberseitig fest eingestellt.
      en: DC (CHAdeMO/CCS) is blocked after restart and while evcc is off. Enable(true) and a subsequent positive MaxCurrent request are both required. The driver renews Modbus register 110 every 5 seconds; after 30 seconds without renewal the QC45 stops unauthorized DC sessions. OCPP retains authorization; Type2 stays operator-fixed.
params:
  - name: modbus
    choice: ["tcpip"]
  - name: mode
    default: dc
render: |
  type: efacec-qc45
  {{- include "modbus" . }}
  mode: {{ .mode }}
